name: collect

# Holt alle 20 Minuten die Feeds, bündelt die Meldungen und veröffentlicht die App.
on:
  schedule:
    - cron: "*/20 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Abhängigkeiten installieren
        run: pip install -r requirements.txt

      - name: Nachrichten sammeln
        id: collect
        continue-on-error: true
        run: python -m collector.main

      - name: Daten speichern
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/data
          if ! git diff --cached --quiet; then
            git commit -m "Daten aktualisiert"
            git pull --rebase --autostash
            git push
          fi

      - name: Seite zusammenstellen (ohne state.json)
        run: |
          rm -rf _site
          cp -r site _site
          rm -f _site/data/state.json

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Veröffentlichen
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Fehler beim Sammeln melden
        if: steps.collect.outcome == 'failure'
        run: |
          echo "Keine einzige Quelle war erreichbar. Details: site/data/status.json"
          exit 1
